apiVersion: apps/v1
kind: Deployment
metadata:
  name: swiggy-deployment
  labels:
    app: food
spec:
  replicas: 3
  selector:
    matchLabels:
      app: food #this should match with pod labels
  template:
    metadata:
      labels:
        app: food #this should be referenced in the service manifest
    spec:
      containers:
        - name: swiggy-container
          image: kastrov/swiggy
          resources:
            limits:
              cpu: "0.5"
              memory: "512Mi"
