apiVersion: v1
kind: Namespace
metadata:
  name: zomato-ns
---
apiVersion: v1
kind: Pod
metadata:
  name: zomato-pod
  namespace: zomato-ns
  labels:
    app: zomato
spec:
  containers:
    - name: zomato-container
      image: kastrov/zomato #public image
      ports: 
        - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: zomato-service
  namespace: zomato-ns
spec:
  type: NodePort
  selector:
    app: zomato
  ports:
    - port: 80
      targetPort: 3000
      nodePort: 30000 #30000-32767
