apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-nodeaffinity-preferred
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx-na-soft
  template:
    metadata:
      labels:
        app: nginx-na-soft
    spec:
      containers:
        - name: nginx
          image: nginx
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preferrence:
              matchExpressions:
                - key: env
                  operator: In
                  values:
                  - prod