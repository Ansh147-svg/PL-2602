apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-nodeselector-dev
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx-ns
  template:
    metadata:
      labels: 
        app: nginx-ns
    spec:
      containers:
        - name: nginx
          image: nginx
      nodeSelector:
        env: dev
        